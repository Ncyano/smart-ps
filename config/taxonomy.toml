# 品类与物料注册表 —— 改这个文件就能扩品类，不用动代码。
#
# 两张表分工：
#   [[product]]  产品类别：判「文案说的动作，这个产品做得到吗」
#   [[material]] 物料类型：这张图属于哪类物料、必须有哪些真实数据
#
# 字段说明（[[product]]）
#   id          英文标识，接口里传这个值（declared 品类）
#   label       中文名，会出现在报错信息里
#   strong      使用动作 / 剂型。命中即定性，**必须是这个品类独有的说法**
#   items       明确品类名。说出名字就定性
#   weak        效果词。两行都能用（"保湿""提亮"），只记命中、不作判定
#   form_hint   给视觉模型看的形态判据，一句话
#   advice      文案与素材冲突时给用户的改法
#
# 字段说明（[[material]]）
#   id              英文标识
#   label           中文名
#   template        对应工艺模板 id（server/app/templates/builtin.py）
#   requires_source 这类物料是否必须有真实数据来源
#   source_fields   必填的数据字段名；缺了就是「待人工」
#   note            给人看的说明
#
# 加一个新品类（例：宠物食品）：
#   [[product]]
#   id = "pet_food"
#   label = "宠物食品"
#   strong = ["每日一袋", "拌粮", "适口性"]
#   items = ["猫粮", "狗粮", "冻干", "罐头"]
#   weak = ["营养", "毛亮"]
#   form_hint = "袋装/罐装宠物粮，包装上有犬猫图案"
#   advice = "宠物食品不能写人用剂量与功效，改成适口性/成分卖点"
#
# 改完不需要重启：taxonomy 按文件 mtime 自动重载。

[[product]]
id = "skincare"
label = "涂抹类化妆品（护肤）"
vision_key = "cosmetic"
form_hint = "旋盖广口罐 / 软管 / 泵瓶，内容物是膏体或液体"
advice = "要么换口服产品素材，要么把文案改成护肤卖点"
strong = [
  "上脸", "上妆", "妆效", "妆感", "遮瑕", "持妆", "不脱妆", "脱妆", "补妆",
  "卸妆", "薄涂", "点涂", "涂抹", "抹开", "拍开", "推开", "服帖", "卡粉",
  "奶油肌", "哑光", "水光", "雾面", "毛孔", "痘印", "红血丝",
  "肤感", "成膜", "贴肤", "浮粉", "斑驳", "底妆", "妆前",
]
items = [
  "面霜", "气垫", "粉底", "精华", "乳液", "面膜", "眼霜", "洁面",
  "爽肤水", "身体乳", "防晒霜", "隔离霜", "粉饼", "散粉", "唇膏", "口红",
]
weak = ["护肤", "保湿", "补水", "修护", "提亮", "抗皱", "紧致", "淡纹", "亮肤", "水乳", "控油"]

[[product]]
id = "oral"
label = "可食用产品（口服）"
vision_key = "edible"
form_hint = "泡罩板 / 瓶装颗粒 / 安瓶口服液 / 粉剂袋"
advice = "要么换护肤品素材，要么改写成口服卖点"
strong = [
  "每天一粒", "每日一粒", "一天一粒", "每天两粒", "每日两粒",
  "每粒", "一粒", "两粒", "三粒", "粒装",
  "软胶囊", "胶囊", "吞服", "口服液", "口服", "冲服", "温水送服",
  "嚼服", "咀嚼片", "泡腾片", "含片", "舌下含", "滴剂", "冲剂", "颗粒剂",
  "随餐服用", "空腹服用", "饭后服用", "疗程装",
]
items = ["保健食品", "膳食补充剂", "固体饮料"]
weak = ["辅酶", "鱼油", "益生菌", "奶蓟草", "维生素", "钙片", "叶黄素", "胶原蛋白肽", "蛋白粉", "膳食纤维", "葡萄籽", "蜂胶", "褪黑素"]

[[product]]
id = "device"
label = "器械 / 仪器"
vision_key = "device"
form_hint = "带按键 / 屏幕 / 充电口的手持设备或台式仪器"
advice = "器械不能写成可食用，也不能只写涂抹效果；按说明书写用法"
strong = ["使用方法", "充电", "档位", "开机", "接触皮肤", "导入", "射频", "微电流", "光疗", "按摩头", "清洁模式", "护理模式"]
items = ["美容仪", "洁面仪", "脱毛仪", "按摩仪", "筋膜枪", "体温计", "血压计"]
weak = ["仪器", "设备", "家用"]

[[product]]
id = "apparel"
label = "服装 / 配饰"
vision_key = "apparel"
form_hint = "平铺或穿在模特身上的纺织品 / 鞋"
advice = "服装文案请按尺码与面料写，不要套护肤或口服的用法"
strong = ["上身", "版型", "尺码", "肩宽", "胸围", "腰围", "裤长", "面料", "克重", "洗后"]
items = ["T恤", "卫衣", "外套", "裤装", "裙装", "内衣", "袜子", "鞋"]
weak = ["显瘦", "舒适", "透气"]


# ─────────────────────────── 物料类型 ───────────────────────────

[[material]]
id = "scene"
label = "场景图"
template = "scene"

[[material]]
id = "white_bg"
label = "白底主图"
template = "white_bg"

[[material]]
id = "kv"
label = "卖点图"
template = "kv"

[[material]]
id = "price"
label = "价格图 / 价签"
template = "price"
requires_source = true
source_fields = ["price_now"]
note = "现价必须来自客户价目表，不能由模型或排版编造"

[[material]]
id = "patent"
label = "专利 / 检测证据图"
template = "patent"
requires_source = true
source_fields = ["patent_no", "issuer"]
note = "必须附真实扫描件，证书内容不得生成"

[[material]]
id = "table"
label = "表格对比海报"
template = "table"
requires_source = true
source_fields = ["rows"]
note = "表内数字须逐项有来源"

[[material]]
id = "screen"
label = "线下大屏 / 灯箱"
template = "screen"
note = "需要真实场景照，四角定位置信度不足时必须人工校准"

[[material]]
id = "pair"
label = "前后对比效果图"
template = "pair"
note = "真实拍摄才能当功效证据；生成 / 合成必须标「示意图」"
